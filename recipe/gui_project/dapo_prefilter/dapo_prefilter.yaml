hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  gen_batch_size: ${data.train_batch_size}
  shuffle: False
  validation_shuffle: False

reward_model:
  reward_manager: dapo
  overlong_buffer:
    enable: False
    len: 0
    penalty_factor: 0.0
    log: False

algorithm:
  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: False
    metric: null
    max_num_gen_batches: 0

trainer:
  project_name: verl-dapo-prefilter
  val_before_train: False
  save_freq: -1
  test_freq: -1
  total_epochs: 1

prefilter:
  output_dir: outputs/dapo_prefilter/${trainer.project_name}/${trainer.experiment_name}
  kept_train_parquet: ${prefilter.output_dir}/filtered_train.parquet
  prompt_report_jsonl: ${prefilter.output_dir}/prompt_report.jsonl
  summary_json: ${prefilter.output_dir}/summary.json
